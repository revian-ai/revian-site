<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revian</title>
  <meta name="description" content="AI agents for healthcare.">
  <meta name="theme-color" content="#F0F5F4">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://revian.com.br/">
  <meta property="og:title" content="Revian">
  <meta property="og:description" content="AI agents for healthcare.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://revian.com.br/">
  <style>
    :root { color-scheme: light; background: #F0F5F4; color: #17232C; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); text-align: center; }
    h1 { margin: 0; font-size: inherit; line-height: 0; }
    img { display: block; width: 100%; height: auto; }
    p { margin: 24px 0 0; color: #526469; font-size: clamp(15px, 2.5vw, 18px); line-height: 1.5; font-weight: 400; letter-spacing: .025em; }
    @media (max-width: 480px) { main { max-width: 300px; } p { margin-top: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1><img src="./logo.svg" alt="Revian" width="1040" height="292"></h1>
    <p>AI agents for healthcare</p>
  </main>
</body>
</html>
